name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install linting tools
        run: pip install flake8 pyflakes

      - name: Lint backend (pyflakes — no unused imports, undefined names)
        run: |
          pyflakes backend/app/adapters/ \
                   backend/app/engines/ \
                   backend/app/repositories/ \
                   backend/app/core/
        continue-on-error: false

      - name: Lint routes & services (flake8, error-level only)
        run: |
          flake8 backend/app/routes/ backend/app/services/ \
            --max-line-length=130 \
            --select=E9,F4,F8 \
            --count
        continue-on-error: false

  frontend-check:
    name: Frontend HTML/JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check HTML files are well-formed (xmllint)
        run: |
          # Install htmlparser for syntax checking
          sudo apt-get install -y libxml2-utils 2>/dev/null || true
          # Check key HTML pages for obvious syntax errors
          for f in frontend/dashboard.html frontend/analytics.html frontend/assistant.html; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              # Basic check: ensure file is non-empty and has DOCTYPE
              grep -q "DOCTYPE\|doctype" "$f" && echo "  OK: $f" || echo "  WARN: $f missing DOCTYPE"
            fi
          done

      - name: Check JS files for syntax errors (node --check)
        run: |
          # Install Node.js for JS syntax check
          node --version || true
          for f in frontend/js/*.js; do
            if [ -f "$f" ]; then
              node --check "$f" && echo "OK: $f" || echo "WARN: syntax issues in $f"
            fi
          done
        continue-on-error: true

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: urbanpulse_test
          POSTGRES_USER: urbanpulse
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: dev
      DATABASE_URL: postgresql://urbanpulse:testpassword@localhost:5432/urbanpulse_test
      # Redis is optional — tests gracefully bypass if unavailable
      REDIS_URL: redis://127.0.0.1:9999/0
      # Ollama — mocked in unit tests; not required for CI
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_PRIMARY_MODEL: qwen3:4b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_TIMEOUT_SECONDS: 5
      # Supabase — not needed for unit tests (mocked)
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder
      SUPABASE_JWT_SECRET: placeholder-secret-at-least-32-chars-long
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      ALLOWED_ORIGINS: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest (unit + API tests, skip slow live-Ollama tests)
        run: |
          pytest backend/tests/ \
            -v \
            -m "not slow" \
            --tb=short \
            --ignore=backend/tests/test_auth_supabase.py

      - name: Show test coverage summary
        run: |
          echo "=== Test Files ==="
          ls backend/tests/test_*.py
          echo "=== Total tests collected ==="
          pytest backend/tests/ -m "not slow" --collect-only -q --ignore=backend/tests/test_auth_supabase.py 2>&1 | tail -3
